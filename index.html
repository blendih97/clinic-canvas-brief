    <meta name="description" content="Upload medical documents in any language, AI extracts everything, share securely with any clinician worldwide. Encrypted, EU-hosted, ICO registered." />

    <meta property="og:title" content="RinVita — Your health history. Everywhere you go." />

    <meta property="og:url" content="https://rinvita.co.uk/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RinVita — Your health history. Everywhere you go." />
    <meta name="twitter:description" content="Upload medical documents in any language, AI extracts everything, share securely with any clinician worldwide." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B8952A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RinVita" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RinVita",
        "legalName": "RinVita Ltd",
        "url": "https://rinvita.co.uk",
        "logo": "https://rinvita.co.uk/icons/icon-512.png",
        "email": "hello@rinvita.co.uk",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit A435, 4-6 Greatorex Street",
          "addressLocality": "London",
          "postalCode": "E1 5NF",
          "addressCountry": "GB"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RinVita",
        "url": "https://rinvita.co.uk"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is my medical data safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Your data is encrypted, stored in Europe, and you control who sees your records."
            }
          },
          {
            "@type": "Question",
            "name": "What languages does RinVita support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "50+ languages including Arabic, Mandarin, Spanish, French, Turkish, Russian, Polish, Hindi, Portuguese and more."
            }
          },
          {
            "@type": "Question",
            "name": "Will a doctor actually use the output?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. RinVita generates a clear, structured summary clinicians can scan in seconds, with originals alongside."
            }
          },
          {
            "@type": "Question",
            "name": "Can I manage records for my parents or children?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The Family plan lets you manage up to six separate health profiles under one account."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
